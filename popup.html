<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redmine QOL Lite</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <main>
      <header>
        <h1>Redmine QOL Lite</h1>
        <p>Подключение и обновление событий</p>
      </header>
      <form id="settings-form">
        <label>
          Адрес Redmine
          <input id="base-url" type="url" placeholder="https://redmine.example.com" required>
        </label>
        <label>
          API key
          <input id="api-key" type="password" autocomplete="off" required>
        </label>
        <label>
          Проверять события
          <select id="poll-minutes">
            <option value="0">Только при открытии</option>
            <option value="1">Раз в минуту</option>
            <option value="5">Раз в 5 минут</option>
            <option value="15">Раз в 15 минут</option>
            <option value="30">Раз в 30 минут</option>
          </select>
        </label>
        <button id="save" type="submit">Сохранить и проверить</button>
      </form>
      <div id="status" role="status" aria-live="polite"></div>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
